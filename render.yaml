services:
  - type: web
    name: moviegraph-ai-backend
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: RENDER_BACKEND_URL
        value: https://moviegraph-ai.onrender.com
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        value: neo4j
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: vectordb
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_API_KEY_1
        sync: false
      - key: MISTRAL_API_KEY_2
        sync: false
      - key: TAVILY_API_KEY
        sync: false
