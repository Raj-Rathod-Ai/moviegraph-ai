# MovieGraph AI — Netlify Deployment Configuration

[build]
  publish = "static"
  command = "echo 'Static frontend — no build step required'"

# Backend API URL injected as environment variable
[build.environment]
  MOVIEGRAPH_API_URL = "https://moviegraph-ai.onrender.com"

# Single Page App (SPA) Hash Routing rewrite
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers (no CSP — it was blocking Lucide/D3/Fonts)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache JS/CSS assets at root (Netlify publishes static/ as /)
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
